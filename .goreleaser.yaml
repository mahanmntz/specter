version: 2
project_name: specter
before:
  hooks:
    - go mod tidy
builds:
  - main: ./cmd/specter
    binary: specter
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags: ["-s -w -X main.version={{.Version}}"]
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [README.md, LICENSE, .env.example, profile.example.json]
checksum:
  name_template: checksums.txt
changelog:
  sort: asc
  filters:
    exclude: ["^chore:", "^docs:", "^test:"]
