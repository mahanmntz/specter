<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Specter</title>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <a class="brand" href="/" aria-label="Specter home"><span class="dot"></span>specter</a>
      <label class="search">
        <svg class="i" aria-hidden="true"><use href="icons.svg#search"/></svg>
        <input id="q" type="search" placeholder="Search jobs" autocomplete="off" aria-label="Search jobs">
        <kbd>/</kbd>
      </label>
      <button id="theme" class="icon-btn" aria-label="Change theme" title="Theme"></button>
      <button id="profile-chip" class="chip-btn" title="Edit your profile" hidden></button>
      <div class="run-group">
        <button id="run" class="primary">Find jobs</button>
        <button id="run-menu-btn" class="primary caret" aria-label="Scan depth" aria-haspopup="true">▾</button>
        <div id="run-menu" class="menu" hidden>
          <button data-mode="quick"><b>Quick scan</b><span>Top 25 companies · about a minute</span></button>
          <button data-mode="full"><b>Full scan</b><span>All companies · a few minutes</span></button>
        </div>
      </div>
    </div>
    <div id="runbar" class="runbar" hidden>
      <div class="track"><div id="runfill" class="fill"></div></div>
      <div class="runtext"><span id="runtext"></span><button id="cancel" class="link">Cancel</button></div>
    </div>
  </header>

  <main class="wrap">
    <div id="views" class="seg views" role="tablist" aria-label="View" hidden>
      <button data-view="list" class="on"><svg class="i" aria-hidden="true"><use href="icons.svg#list"/></svg>Jobs</button>
      <button data-view="board"><svg class="i" aria-hidden="true"><use href="icons.svg#columns-3"/></svg>Board <span id="due-badge" class="due-badge" hidden></span></button>
    </div>

    <section class="hero" id="hero" hidden>
      <h1 id="greeting"></h1>
      <p id="subgreeting" class="muted"></p>
      <div id="stats" class="stats"></div>
    </section>

    <section id="board" class="board" hidden aria-label="Application board"></section>

    <section class="filters" id="filters" aria-label="Filters">
      <div class="pills">
        <button id="global" class="pill" aria-pressed="false"><svg class="i" aria-hidden="true"><use href="icons.svg#globe"/></svg>Worldwide</button>
        <button id="contractor" class="pill" aria-pressed="false"><svg class="i" aria-hidden="true"><use href="icons.svg#handshake"/></svg>Contractor</button>
        <select id="fresh" class="pill select" aria-label="Posted">
          <option value="0">Any time</option>
          <option value="1">Past 24h</option>
          <option value="3">Past 3 days</option>
          <option value="7">Past week</option>
          <option value="30">Past month</option>
        </select>
        <button id="more-toggle" class="pill" aria-expanded="false">More filters</button>
        <button id="reset" class="link" hidden>Clear</button>
      </div>
      <div id="more" class="more" hidden>
        <div class="row-label">Level</div>
        <div id="levels" class="pills"></div>
        <div class="row-label">Skill match</div>
        <select id="min_score" class="pill select" aria-label="Minimum skill match">
          <option value="0">Any</option><option value="45">45%+</option><option value="65">65%+</option><option value="80">80%+</option>
        </select>
        <div class="row-label">Company</div>
        <input id="company" class="text" type="search" placeholder="e.g. stripe" autocomplete="off">
        <div class="row-label">Tech <span class="hint">(must include all)</span></div>
        <div id="keywords" class="pills"></div>
      </div>
    </section>

    <div class="listhead" id="listhead">
      <div id="tabs" class="seg" role="tablist">
        <button data-status="active" class="on">Jobs</button>
        <button data-status="saved">Saved</button>
        <button data-status="applied">Applied</button>
        <button data-status="hidden">Hidden</button>
      </div>
      <div class="rhs">
        <span id="count" class="muted"></span>
        <select id="sort" class="plain" aria-label="Sort">
          <option value="best">Best match</option>
          <option value="newest">Newest</option>
          <option value="company">Company</option>
        </select>
      </div>
    </div>

    <div id="list" class="list"></div>
    <button id="loadmore" class="more-btn" hidden>Show more</button>
    <div id="empty" class="empty" hidden></div>

    <footer class="foot">Specter runs on your computer. Your profile and job list never leave it. <span class="kbds"><kbd>/</kbd> search <kbd>j</kbd><kbd>k</kbd> move <kbd>Enter</kbd> details</span></footer>
  </main>

  <div id="scrim" class="scrim" hidden></div>
  <aside id="drawer" class="drawer" hidden aria-label="Job details"></aside>
  <dialog id="setup" aria-labelledby="setup-title"></dialog>
  <div id="toast" class="toast" role="status" hidden></div>

  <script src="app.js"></script>
</body>
</html>
